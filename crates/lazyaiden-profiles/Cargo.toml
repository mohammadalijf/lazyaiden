[package]
name = "lazyaiden-profiles"
description = "Profile business logic: local YAML store, import/export, and sync with a brewer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fellow-client = { path = "../fellow-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"

[dev-dependencies]
fellow-client = { path = "../fellow-client", features = ["testing"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tempfile = "3"
proptest = "1"

[lints]
workspace = true
