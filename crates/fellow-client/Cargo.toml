[package]
name = "fellow-client"
description = "Client protocol and default HTTP implementation for the Fellow Aiden cloud API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes `InMemoryFellow`, a fake `FellowApi` for tests and demos.
testing = []

[dependencies]
async-trait = "0.1.92"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["time", "sync"] }

[dev-dependencies]
fellow-client = { path = ".", features = ["testing"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

[lints]
workspace = true
