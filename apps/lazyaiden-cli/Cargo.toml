[package]
name = "lazyaiden-cli"
description = "Headless command-line interface for Aiden: manage Fellow Aiden profiles and schedules from scripts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lazyaiden_cli"
path = "src/lib.rs"

[[bin]]
name = "lazyaiden-cli"
path = "src/main.rs"

[dependencies]
lazyaiden-core = { path = "../../crates/lazyaiden-core", features = ["demo"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
rpassword = "7"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"
wiremock = "0.6"
fellow-client = { path = "../../crates/fellow-client", features = ["testing"] }

[lints]
workspace = true
